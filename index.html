
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
    form { margin-bottom: 30px; padding: 20px; background: #f4f4f4; border-radius: 8px; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card-foto { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; background: #fff; }
    .card-foto img, .card-foto video { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    .card-foto p { margin: 8px 0 0 0; font-size: 14px; color: #333; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  </style>
</head>
<body>

  <h2>Enviar Nova Foto</h2>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="foto" required>
    <button type="submit">Enviar</button>
  </form>

  <h2>Galeria de Arquivos Enviados</h2>
  <div id="galeria" class="galeria"></div>

  <script>
    // Função para carregar as fotos do banco de dados
    async function carregarFotos() {
      try {
        const resposta = await fetch('/fotos');
        const fotos = await resposta.json();

        const container = document.getElementById('galeria');
        container.innerHTML = ''; // Limpa a galeria antes de renderizar

        fotos.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card-foto';

          // Verifica se é imagem para exibir a tag <img>
          if (item.url.match(/\.(jpeg|jpg|gif|png)$/i)) {
            card.innerHTML = `
              <img src="${item.url}" alt="${item.nome}">
              <p title="${item.nome}">${item.nome}</p>
            `;
          } else if (item.url.match(/\.(mp4|webm)$/i)) {
            card.innerHTML = `
              <video src="${item.url}" controls></video>
              <p title="${item.nome}">${item.nome}</p>
            `;
          } else {
            // Para outros tipos de arquivo (PDF, DOCX, TXT)
            card.innerHTML = `
              <a href="${item.url}" target="_blank">📄 Abrir Arquivo</a>
              <p title="${item.nome}">${item.nome}</p>
            `;
          }

          container.appendChild(card);
        });
      } catch (err) {
        console.error('Erro ao carregar a galeria:', err);
      }
    }

    // Executa a função ao carregar a página
    carregarFotos();
  </script>
</body>
</html>
