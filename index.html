
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Enviar Fotos para o PostgreSQL</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    input, button { margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Upload de Fotos</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="foto" required />
      <button type="submit">Enviar Foto</button>
    </form>
  </div>

</body>
</html>
